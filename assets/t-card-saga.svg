</svg><text x="122" y="62" font-size="27" font-weight="700" fill="#173b2e">saga-checkout</text><text x="123" y="90" font-size="15" fill="#52796f">Distributed payment saga</text><text x="556" y="62" font-size="22" fill="#40916c" text-anchor="end">↗</text><text x="32" y="140" font-size="16" fill="#2f4f43">Orchestrates a 4-step checkout across services over Kafka,</text><text x="32" y="164" font-size="16" fill="#2f4f43">with a transactional outbox, idempotent requests and</text><text x="32" y="188" font-size="16" fill="#2f4f43">automatic compensation when a step fails.</text><line x1="32" y1="216" x2="568" y2="216" stroke="#cfeadb" stroke-width="1.5"/><text x="32" y="262" font-size="36" font-weight="800" fill="#2d6a4f" letter-spacing="-.5">16.3/s</text><text x="157" y="246" font-size="14" fill="#52796f">completed sagas</text><text x="157" y="265" font-size="14" fill="#52796f">across 5 JVMs</text><rect x="344" y="239" width="52" height="26" rx="13.0" fill="#e1f4ea"/><text x="370.0" y="254" font-size="12" fill="#1f5640" text-anchor="middle" font-weight="600">Java</text><rect x="404" y="239" width="60" height="26" rx="13.0" fill="#e1f4ea"/><text x="434.0" y="254" font-size="12" fill="#1f5640" text-anchor="middle" font-weight="600">Kafka</text><rect x="472" y="239" width="96" height="26" rx="13.0" fill="#e1f4ea"/><text x="520.0" y="254" font-size="12" fill="#1f5640" text-anchor="middle" font-weight="600">PostgreSQL</text></g></svg></svg>