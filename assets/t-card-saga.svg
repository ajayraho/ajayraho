<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 302.0" width="600" height="302.0" role="img" aria-label="saga-checkout: Orchestrates a 4-step checkout across services over Kafka, with a transactional outbox, idempotent requests and automatic compensation when a step fails." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="600" height="302.0" fill="#e4f5eb"/><svg x="12" y="12" width="556" height="278.00" viewBox="0 0 600 300" overflow="visible"><style>.sway{animation:sway 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom left}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.4s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{animation:pop .9s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
