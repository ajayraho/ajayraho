<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 70" width="1200" height="70" role="img" aria-label="Selected work" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.sway{animation:sway 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom left}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.4s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{animation:pop .9s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}</style><g font-family="Segoe UI,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif"><g transform="translate(14,40)"><path d="M0,0 C4,-14 16,-22 26,-22 C24,-10 14,0 0,0Z" fill="#52b788"/><path d="M2,-2 L20,-18" stroke="#2d6a4f" stroke-width="1.5"/></g>
<text x="52" y="44" font-size="24" font-weight="700" fill="#2d6a4f">Selected work</text>
<path d="M242,36 C478,30 800,42 1186,34" stroke="#95d5b2" stroke-width="2.5" fill="none" stroke-linecap="round"/></g></svg>