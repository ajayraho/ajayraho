<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="WaaS: A multi-tenant waitlist any product can plug into. People see their place update live and get a timed checkout slot; Redis Lua scripts make sure no slot is handed out twice." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.sway{animation:sway 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom left}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.4s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{animation:pop .9s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}</style><g font-family="Segoe UI,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif"><rect x="1.5" y="1.5" width="597" height="297" rx="22" fill="#f4fbf7" stroke="#cfeadb" stroke-width="2"/><rect x="30" y="30" width="72" height="72" rx="18" fill="#ffffff" stroke="#cfeadb" stroke-width="1.5"/><svg x="38" y="38" width="56" height="56" viewBox="0 0 512 512">
  
  <style>
    /* The ring ticks a quarter turn four times (one full lap per 6 s, so the loop is seamless);
       the three people in line hop forward after every tick. Same motion as the app's hover. */
    .ring { transform-box: view-box; transform-origin: 256px 256px; animation: tick 6s infinite; }
    .dot { transform-box: fill-box; transform-origin: center; animation: hop 1.5s ease-out infinite; }
    .d2 { animation-delay: 0.08s; }
    .d3 { animation-delay: 0.16s; }
    @keyframes tick {
      0%   { transform: rotate(0deg);   animation-timing-function: cubic-bezier(0.3, 1.4, 0.5, 1); }
      9%   { transform: rotate(90deg); }
      25%  { transform: rotate(90deg);  animation-timing-function: cubic-bezier(0.3, 1.4, 0.5, 1); }
      34%  { transform: rotate(180deg); }
      50%  { transform: rotate(180deg); animation-timing-function: cubic-bezier(0.3, 1.4, 0.5, 1); }
      59%  { transform: rotate(270deg); }
      75%  { transform: rotate(270deg); animation-timing-function: cubic-bezier(0.3, 1.4, 0.5, 1); }
      84%  { transform: rotate(360deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes hop {
      0%, 30%, 100% { transform: none; }
      13% { transform: translateY(-14%) scale(1.25); }
    }
    @media (prefers-reduced-motion: reduce) { .ring, .dot { animation: none; } }
  </style>
  <rect width="512" height="512" rx="104" fill="#1c2733"/>
  <path class="ring" d="M 256 119 A 137 137 0 1 0 393 256" fill="none" stroke="#e8ecef" stroke-width="13"/>
  <circle class="dot" cx="256" cy="195.4" r="18.5" fill="#d9b06b"/>
  <circle class="dot d2" cx="256" cy="256" r="18.5" fill="#d9b06b"/>
  <circle class="dot d3" cx="256" cy="316.6" r="18.5" fill="#d9b06b"/>
</svg><text x="122" y="62" font-size="27" font-weight="700" fill="#173b2e">WaaS</text><text x="123" y="90" font-size="15" fill="#52796f">Waitlist-as-a-Service · backend</text><text x="556" y="62" font-size="22" fill="#40916c" text-anchor="end">↗</text><text x="32" y="140" font-size="16" fill="#2f4f43">A multi-tenant waitlist any product can plug into. People</text><text x="32" y="164" font-size="16" fill="#2f4f43">see their place update live and get a timed checkout slot;</text><text x="32" y="188" font-size="16" fill="#2f4f43">Redis Lua scripts make sure no slot is handed out twice.</text><line x1="32" y1="216" x2="568" y2="216" stroke="#cfeadb" stroke-width="1.5"/><text x="32" y="262" font-size="36" font-weight="800" fill="#2d6a4f" letter-spacing="-.5">0.4 s</text><text x="135" y="246" font-size="14" fill="#52796f">500 concurrent joins</text><text x="135" y="265" font-size="14" fill="#52796f">336 ms p99 (k6)</text><rect x="337" y="239" width="52" height="26" rx="13.0" fill="#e1f4ea"/><text x="363.0" y="254" font-size="12" fill="#1f5640" text-anchor="middle" font-weight="600">Java</text><rect x="397" y="239" width="103" height="26" rx="13.0" fill="#e1f4ea"/><text x="448.5" y="254" font-size="12" fill="#1f5640" text-anchor="middle" font-weight="600">Spring Boot</text><rect x="508" y="239" width="60" height="26" rx="13.0" fill="#e1f4ea"/><text x="538.0" y="254" font-size="12" fill="#1f5640" text-anchor="middle" font-weight="600">Redis</text></g></svg>